<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="tile" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#e3f4f7"/><path d="M0 .5H48M.5 0V48" stroke="#c4e3ea" stroke-width="3"/></pattern>
    <pattern id="ftile" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#f4f1ea"/><rect width="40" height="40" fill="#dfe9ee"/><rect x="40" y="40" width="40" height="40" fill="#dfe9ee"/></pattern>
    <pattern id="plank" width="200" height="40" patternUnits="userSpaceOnUse"><rect width="200" height="40" fill="#d99b62"/><path d="M0 39H200M120 0V40" stroke="#c4864f" stroke-width="3"/></pattern>
    <pattern id="curtainp" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#bfe3f7"/><circle cx="12" cy="12" r="5" fill="#fff"/><circle cx="30" cy="30" r="4" fill="#ffd23f"/></pattern>
    <pattern id="hallp" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#ffe2cc"/><path d="M20 0V40" stroke="#ffd4b5" stroke-width="8"/></pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef8fc"/><stop offset=".5" stop-color="#cbe6f2"/><stop offset="1" stop-color="#e6f4fa"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd5db"/><stop offset=".5" stop-color="#f4f6f8"/><stop offset="1" stop-color="#bcc3ca"/></linearGradient>
  </defs>
  <g stroke="#6b4a36" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
