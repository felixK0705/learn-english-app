      <path d="M0 0q0-24 22-24q22 0 22 24q0 18-22 18q-22 0-22-18z" fill="#ff8fb1"/>
      <path d="M2 -6q20-14 40 0" fill="none" stroke="#fff" stroke-width="7"/>
      <path d="M54 6q0-24 22-24q22 0 22 24q0 18-22 18q-22 0-22-18z" fill="#ff8fb1"/>
      <path d="M56 0q20-14 40 0" fill="none" stroke="#fff" stroke-width="7"/>
    </g>
    <!-- 排水孔 -->
    <ellipse cx="660" cy="900" rx="34" ry="14" fill="#c3c9d0"/>
    <path d="M640 896h40M636 904h48M648 890h24" stroke-width="3"/>
    <!-- 體重計 -->
    <rect x="880" y="880" width="150" height="34" rx="12" fill="#f4f6f8"/>
    <rect x="928" y="884" width="54" height="14" rx="4" fill="#3b3b42"/><path d="M944 891h22" stroke="#7cf5c0" stroke-width="3"/>
    <path d="M880 914h150" stroke-width="4"/>
  </g>
</svg>
