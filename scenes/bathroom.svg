    <rect x="592" y="200" width="138" height="212" rx="18" fill="url(#glass)"/>
    <path d="M612 262l46-46M620 300l70-70" stroke="#fff" stroke-width="9"/>
    <!-- 檯面＋櫃子 -->
    <rect x="482" y="580" width="316" height="190" rx="8" fill="#a6ddd2"/>
    <rect x="494" y="596" width="140" height="160" rx="6" fill="#c3ebe2"/><rect x="646" y="596" width="140" height="160" rx="6" fill="#c3ebe2"/>
    <path d="M622 660v40M658 660v40" stroke-width="6"/>
    <rect x="470" y="556" width="340" height="28" rx="8" fill="#fff"/>
