    <rect x="966" y="520" width="80" height="36" rx="6" fill="#c56fa0"/>
    <path d="M992 520q14-30 28 0z" fill="#fff"/>
    <!-- 水箱 -->
    <rect x="950" y="556" width="114" height="90" rx="12" fill="#fff"/>
    <rect x="1030" y="572" width="20" height="10" rx="4" fill="#cfd5db"/>
    <!-- 馬桶 -->
    <path d="M928 660h156q0 70-50 88l6 22h-68l6-22q-50-18-50-88z" fill="#fff"/>
    <rect x="920" y="646" width="172" height="20" rx="9" fill="#f2f6f8"/>
    <!-- 衛生紙架 -->
    <path d="M1112 600h40" stroke="#9aa5b1" stroke-width="6"/><path d="M1112 592v16" stroke="#9aa5b1" stroke-width="6"/>
    <!-- 浴袍（掛在門邊） -->
    <circle cx="1128" cy="340" r="7" fill="#9aa5b1"/>
    <path d="M1128 346q-22 0-28 20l-12 46l12 8l-4 146q32 12 64 0l-4-146l12-8l-12-46q-6-20-28-20z" fill="#b9a6f0"/>
    <path d="M1114 352l14 40l14-40" fill="none" stroke-width="3"/><path d="M1128 392v170" stroke-width="3"/>
    <path d="M1100 470h56" stroke="#fff" stroke-width="6"/><path d="M1104 470l-8 26M1152 470l8 26" stroke="#fff" stroke-width="4"/>

    <!-- ===== 地上 ===== -->
    <!-- 踏墊 -->
    <rect x="96" y="842" width="270" height="56" rx="20" fill="#7fc8b8"/>
    <rect x="110" y="852" width="242" height="36" rx="14" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 8"/>
