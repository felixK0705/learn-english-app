    <rect x="226" y="384" width="40" height="66" rx="10" fill="#ff8fb1"/><rect x="236" y="370" width="20" height="16" rx="4" fill="#fff"/>
    <rect x="232" y="404" width="28" height="22" rx="4" fill="#fff" stroke-width="3"/>
    <rect x="280" y="398" width="34" height="52" rx="9" fill="#7cc66a"/><rect x="288" y="386" width="18" height="14" rx="4" fill="#fff"/></g>
