    <path d="M0 770H1180" stroke-width="4"/>
    <!-- 霧面小窗 -->
    <rect x="890" y="104" width="170" height="104" rx="10" fill="#fff"/>
    <rect x="902" y="116" width="146" height="80" rx="5" fill="#dceff6"/>
    <path d="M975 116v80" stroke="#fff" stroke-width="6"/>
    <g fill="#fff" stroke="none" opacity=".8"><circle cx="920" cy="140" r="4"/><circle cx="944" cy="168" r="5"/><circle cx="1000" cy="132" r="4"/><circle cx="1024" cy="170" r="5"/></g>
    <!-- 走廊 -->
    <rect x="1180" width="420" height="770" fill="url(#hallp)" stroke="none"/>
    <rect x="1180" y="770" width="420" height="230" fill="url(#plank)" stroke="none"/>
    <rect x="1180" y="752" width="420" height="20" fill="#fff8ea"/>
    <rect x="1440" y="250" width="110" height="90" rx="6" fill="#d79a5c"/><rect x="1452" y="262" width="86" height="66" rx="3" fill="#fff4cf"/>
    <path d="M1452 328l26-30l18 16l16-20l26 34z" fill="#7cc66a" stroke-width="3"/><circle cx="1520" cy="280" r="7" fill="#ffd23f" stroke-width="2.5"/>
    <path d="M1340 0v70" stroke-width="4"/><path d="M1300 70h80l-14 40h-52z" fill="#ffd23f"/><circle cx="1340" cy="120" r="10" fill="#fff6b0" stroke="none"/>
    <!-- 隔間牆與門框 -->
