    <path d="M90 382q40 0 46 30" fill="none" stroke="#9aa5b1" stroke-width="8"/>
    <path d="M118 410l40-14l14 30l-40 14z" fill="url(#steel)"/>
    <path d="M140 446v20M152 442v22M164 438v20" stroke="#7fd0f5" stroke-width="4" stroke-dasharray="4 8"/>
