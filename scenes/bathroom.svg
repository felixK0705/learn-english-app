    <path d="M662 556V500q0-18 22-18h14" fill="none" stroke="#9aa5b1" stroke-width="10"/>
    <path d="M662 556V500q0-18 22-18h14" fill="none" stroke="#eef1f4" stroke-width="4"/>
    <!-- 牙膏 -->
    <path d="M748 552l44-14l5 12l-44 14z" fill="#fff"/><path d="M758 550l22-7" stroke="#5b8def" stroke-width="5"/><rect x="792" y="534" width="11" height="13" rx="3" fill="#ff6f61" transform="rotate(-16 797 540)"/>
    <!-- 牙刷杯 -->
    <path d="M494 556l-4-34h36l-4 34z" fill="#7fc8b8"/>

    <!-- ===== 馬桶 ===== -->
    <!-- 毛巾架＋毛巾 -->
    <path d="M924 330h146" stroke="#9aa5b1" stroke-width="8"/><circle cx="924" cy="330" r="8" fill="#cfd5db"/><circle cx="1070" cy="330" r="8" fill="#cfd5db"/>
    <path d="M944 326h106v120q-53 12-106 0z" fill="#ff8f6b"/>
    <path d="M944 420q53 12 106 0M944 432q53 12 106 0" fill="none" stroke="#fff" stroke-width="4"/>
